name: Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-apk:
    name: Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect Android project
        id: detect
        run: |
          if [ -f capacitor.config.ts ] && [ -d android ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Android project is not initialized yet (Phase 9 pending)."
          fi

      - name: Build APK inside Docker
        if: steps.detect.outputs.ready == 'true'
        run: make build-apk

      - name: Upload APK artifact
        if: steps.detect.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 14
