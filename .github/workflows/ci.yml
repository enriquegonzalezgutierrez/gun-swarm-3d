name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Docker tooling
        run: |
          docker --version
          docker compose version
          make --version

      - name: Install locked dependencies
        run: make init-ci

      - name: Lint and type-check
        run: make lint

      - name: Run test suite
        run: make test

      - name: Automated full-game bot
        run: make bot
        timeout-minutes: 10

      - name: Build production web bundle
        run: make build-web

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build debug APK inside Docker
        run: make build-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: output/app-debug.apk
          if-no-files-found: error
          retention-days: 7
